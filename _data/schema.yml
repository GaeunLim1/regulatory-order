# Master frame: four layers, in order.
# Object of the rule and Convergence carry fixed types. Design Layer crosses
# two independent axes. Cost Layer carries no types, a matrix of firm-level
# variables, filled before any outcome is known.

object_of_the_rule:
  types: [attribute-based, relational, conduct-based]
  open_question: >
    What does the text name as its target: a measured attribute, a position
    in a network, or a future conduct condition?

design_layer:
  axes:
    scope: [intra vires, boundary redraw]
    trigger: [numeric, conduct]
  open_question: >
    Does this rulemaking sit inside the article's delegated authority or
    redraw that boundary? Does it fire on a threshold/date or on an actor's
    conduct?

cost_layer:
  types: []
  variables: [distance from object, revenue share exposed, substitution available, prior positioning]
  open_question: >
    Firm by firm: how far from the named object, how much revenue is
    exposed, is substitution available, and is the firm already positioning
    before any outcome is known?

convergence:
  types: [direct hit, reallocation, amplification, diffusion]
  conduct_trigger_only: [latent, conditional reinstatement]
  test:
    - scale proportional to the trigger?
    - if proportional, does the landing point match the named target?
  open_question: >
    Reading the Cost Layer matrix against the two-question test above, which
    type does the outcome fall into?

method_note:
  statement: >
    The frame is provisional. A case may expose a distinction that requires
    revision of the shared vocabulary; the case is not required to fit a
    pre-fixed taxonomy.

