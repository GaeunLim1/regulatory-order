# Master frame: traces a rule from the design intent behind it through
# firm-level exposure to the point a company actually has to comply,
# independent of whether implementation gets delayed or staged along the
# way.
#
# Object of the rule and Convergence carry fixed types. Design Layer crosses
# two independent axes. Cost Layer carries no types, a matrix of firm-level
# variables, filled before any outcome is known.

object_of_the_rule:
  types: [attribute-based, relational, conduct-based]
  open_question: >
    What does the text name as its target: a measured attribute, a position
    in a network, or a future conduct condition?

design_layer:
  axes:
    scope: [within the existing line, redrawing the line]
    trigger: [numeric, conduct]
  scope_trace:
    authorizing_text: >
      The provision that hands the agency its job, and how far that job
      runs. Cited directly, not summarized.
    stated_aim: >
      What the agency says it is doing: preamble, stated rationale,
      legislative history.
    operative_reach: >
      Who the rule's own wording actually covers, read on its own,
      independent of the stated aim.
    gap: >
      Mismatch between the grant, the stated aim, and the operative reach.
      No mismatch points to within the existing line. A mismatch that pulls
      in a new class of actor points to redrawing the line.
  open_question: >
    Does this rulemaking sit inside the agency's authorizing text, or does
    it redraw that line? Does it fire on a threshold/date or on an actor's
    conduct?

cost_layer:
  types: []
  variables: [distance from object, revenue share exposed, substitution available, prior positioning]
  open_question: >
    Firm by firm: how far from the named object, how much revenue is
    exposed, is substitution available, and is the firm already positioning
    before any outcome is known?

convergence:
  types: [direct hit, reallocation, amplification, diffusion]
  conduct_trigger_only: [latent, conditional reinstatement]
  test:
    - scale proportional to the trigger?
    - if proportional, does the landing point match the named target?
  open_question: >
    Reading the Cost Layer matrix against the two-question test above, which
    type does the outcome fall into?
  pre_landing: >
    A type from this list is assigned only once the landing point is
    observed. Before that, on a watchlist item, this layer stays pending;
    if a forward look is useful, write it as a scenario against the Cost
    Layer matrix (what changes under condition X), not as a type guessed in
    advance.

method_note:
  statement: >
    The frame is provisional. A case may expose a distinction that requires
    revision of the shared vocabulary; the case is not required to fit a
    pre-fixed taxonomy.

# Closed-case construction set removed from the site. The working set is watchlist.
