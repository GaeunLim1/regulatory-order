# Case template. Current analytical frame (see _data/schema.yml)
# Case-specific content is intentionally open. These are prompts for drafting,
# not fields to fill in mechanically.

id:
title:
status: draft
regulatory_subject:

# Does this case belong in the construction set? All four required:
# text already existed / execution delayed or conditioned / delay ended for
# reasons other than the firm's own misconduct / landing point observable.
construction_set_eligible:

object_of_the_rule:
  open_question: What does the text name as its target, and what type: attribute-based, relational, conduct-based?
  notes:

design_layer:
  open_question: Intra vires or boundary redraw? Numeric trigger or conduct trigger?
  notes:

cost_layer:
  open_question: >
    Firm by firm: distance from the object, revenue exposed, substitution
    available, prior positioning. Fill this before looking up the outcome.
  notes:

convergence:
  open_question: >
    Against the Cost Layer matrix: proportional or disproportionate? If
    proportional, does the landing point match the named target?
  notes:

